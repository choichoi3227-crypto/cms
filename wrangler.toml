# CloudPress CMS — wrangler.toml
name                   = "cloudpress-cms"
pages_build_output_dir = "."
compatibility_date     = "2025-04-01"
compatibility_flags    = ["nodejs_compat"]

[[d1_databases]]
binding       = "DB"
database_name = "cloudpress-cms-db"
database_id   = "REPLACE_WITH_YOUR_D1_ID"

[[kv_namespaces]]
binding = "CACHE"
id      = "REPLACE_WITH_YOUR_KV_CACHE_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id      = "REPLACE_WITH_YOUR_KV_SESSION_ID"

[[kv_namespaces]]
binding = "OPTIONS"
id      = "REPLACE_WITH_YOUR_KV_OPTIONS_ID"

[vars]
WP_TABLE_PREFIX = "wp_"
SITE_URL        = "https://cms-b56.pages.dev/"
GITHUB_OWNER    = ""
GITHUB_REPO     = ""
APP_ENV         = "production"
APP_VERSION     = "1.0.0"

[dev]
port           = 8787
local_protocol = "http"
