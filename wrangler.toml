# CloudPress CMS — wrangler.toml
name                   = "cloudpress-cms"
main                   = "worker/src/index.ts"
compatibility_date     = "2025-04-01"
compatibility_flags    = ["nodejs_compat"]

# `node scripts/setup.mjs` replaces these local placeholders with account IDs.
[[d1_databases]]
binding = "DB"
database_name = "cloudpress-cms"
database_id = "c630c12f-afbd-44c5-8f59-844614970a2d"

[[kv_namespaces]]
binding = "CACHE"
id = "9b8370d20a9646b9aa73f63c9200379f"

[[kv_namespaces]]
binding = "SESSIONS"
id = "19e5e273e99941fbb963300e56dbdf9e"

[[kv_namespaces]]
binding = "OPTIONS"
id = "a7cf8328050e4203a109c64aa8d43841"

[[durable_objects.bindings]]
name = "CACHE_COORDINATOR"
class_name = "CacheCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CacheCoordinator"]

[triggers]
crons = ["*/5 * * * *"]
[vars]
WP_TABLE_PREFIX = "wp_"
SITE_URL        = "https://cloud-press.co.kr"
GITHUB_OWNER    = ""
GITHUB_REPO     = ""
APP_ENV         = "production"
APP_VERSION     = "1.0.0"

[dev]
port           = 8787
local_protocol = "http"
