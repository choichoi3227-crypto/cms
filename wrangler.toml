# CloudPress CMS — wrangler.toml
name                   = "cloudpress-cms"
pages_build_output_dir = "dist"
compatibility_date     = "2025-04-01"
compatibility_flags    = ["nodejs_compat"]
[vars]
WP_TABLE_PREFIX = "wp_"
SITE_URL        = "https://cloud-press.co.kr"
GITHUB_OWNER    = ""
GITHUB_REPO     = ""
APP_ENV         = "production"
APP_VERSION     = "1.0.0"

[dev]
port           = 8787
local_protocol = "http"
