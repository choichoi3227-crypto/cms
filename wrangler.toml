# CloudPress CMS — wrangler.toml
name                   = "cloudpress-cms"
pages_build_output_dir = "."
compatibility_date     = "2025-04-01"
compatibility_flags    = ["nodejs_compat"]

[[d1_databases]]
binding       = "DB"
database_name = "cloudpress-cms-db"
database_id   = "REPLACE_WITH_YOUR_D1_ID"

[[kv_namespaces]]
binding = "CACHE"
id      = "REPLACE_WITH_YOUR_KV_CACHE_ID"

[[kv_namespaces]]
binding = "SESSION_SWAP"
id      = "REPLACE_WITH_YOUR_KV_SESSION_ID"

[vars]
WP_TABLE_PREFIX = "wp_"
SITE_URL        = "https://cloud-press.co.kr"
GITHUB_OWNER    = ""
GITHUB_REPO     = ""

[dev]
port           = 8787
local_protocol = "http"
